[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE).*" [0-9]{3} .*
# Не считаем:
# 1) успешную (2xx/3xx) статику: одна загрузка главной — это ~110 запросов, в основном
#    /_next/image. Её отдаёт кэш nginx (nginx/nginx.conf), так что она дешёвая. А вот
#    429 от лимитов nginx и 404 на несуществующие файлы считаются — кто долго долбит
#    статику сверх лимита или перебирает пути, попадёт в бан;
# 2) успешные (2xx/3xx) запросы к путям админки. Посторонним nginx отвечает на них 403
#    (allow из allowed-ips.conf + deny all), так что 2xx/3xx здесь бывают только у разрешённых
#    адресов, а 403 от остальных по-прежнему считаются. Список путей — как в location админки
#    в nginx/nginx.conf, менять вместе.
ignoreregex = "(?:GET|HEAD) /(?:_next/static/|_next/image\?|uploads/|favicon\.ico)[^"]*" [23]\d\d 
              "[A-Z]+ /(?:admin|content-type-builder|content-manager|users-permissions|email|i18n|sortable-entries|upload|api/)[^"]*" [23]\d\d 
# Дата в логе nginx стоит не в начале строки, а в квадратных скобках после IP
datepattern = ^[^\[]*\[({DATE})
