# Основной конфиг nginx (в образе — /etc/nginx/nginx.conf). Отличия от стандартного
# конфига образа nginx:alpine: больше соединений, лог со временем ответа и статусом
# кэша, короткие таймауты. Сайт и лимиты — в nginx.conf (шаблон conf.d/default.conf)

user  nginx;
worker_processes  auto;
# Каждое проксируемое соединение — два дескриптора (клиент + upstream), плюс файлы кэша
worker_rlimit_nofile 65536;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    # По умолчанию 1024 на воркер: при 4 ядрах ~4000 соединений, их несложно занять
    # медленными клиентами с нескольких машин. Простое соединение стоит пару КБ памяти
    worker_connections  8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Формат main из стандартного конфига + в конце время ответа (rt — всего, urt — upstream)
    # и статус кэша. Начало строки не менялось: на него завязан fail2ban
    # (fail2ban/filter.d/nginx-flood.conf). Новые поля добавлять только в конец
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;

    # Медленные клиенты (slowloris): кто не прислал заголовки или тело за 10 с — до свидания.
    # Для HTTP/2 эти же таймауты действуют вместо устаревших http2_*_timeout
    client_header_timeout  10s;
    client_body_timeout    10s;
    send_timeout           30s;
    keepalive_timeout      30s;
    # Сразу освобождать память и сокет зависшего по таймауту соединения
    reset_timedout_connection on;

    include /etc/nginx/conf.d/*.conf;
}
