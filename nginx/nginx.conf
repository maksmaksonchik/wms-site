# Шаблон /etc/nginx/conf.d/default.conf (envsubst подставляет ${NGINX_SERVER_NAME}).
# Подключается внутрь http {} из nginx-main.conf.
#
# Защита от нагрузки, коротко (подробнее — README.md, «Нагрузка и защита»):
#  - HTML кэшируется на 10 с (микрокэш): сколько бы ни было посетителей, Next рендерит
#    каждую страницу не чаще раза в 10 с. Если Next или Strapi лежат — отдаём последнюю копию.
#  - /_next/static и /_next/image кэшируются надолго, повторно их отдаёт сам nginx.
#  - Всё, что всё-таки идёт в Next, ограничено max_conns: перегрузить Node нельзя,
#    лишние запросы сразу получают 503 (или устаревшую копию из кэша).
#  - Лимиты на IP: limit_req (частота) и limit_conn (оригиналы картинок из /uploads).
#    Число TCP-соединений с IP режет файрвол (infra/vm/lib/app.sh, zmsh-connlimit).
#  - fail2ban банит по логу тех, кто долго превышает порог (fail2ban/).

map $request_method $not_allowed_method {
    default 0;
    TRACE 1;
}

server_tokens off;

# --- Лимиты по IP --------------------------------------------------------------
# Без лимитов: локальные адреса и docker-сети (Next забирает оригиналы картинок из
# /uploads через публичный адрес сайта и приходит сюда с адреса шлюза docker-сети),
# LAN, а также адреса из limit-exempt.conf (например, машина нагрузочного теста)
geo $limit_exempt {
    default         0;
    127.0.0.0/8     1;
    ::1             1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    include /etc/nginx/limit-exempt.conf;
}
# Пустой ключ limit_req/limit_conn не учитывают
map $limit_exempt $limit_key {
    0 $binary_remote_addr;
    1 "";
}

# HTML и прочее, что идёт в Next. Страница — это ~3 таких запроса (документ + предзагрузки),
# так что 10 в секунду с запасом хватает даже нескольким людям за одним NAT
limit_req_zone  $limit_key zone=req_pages:10m  rate=10r/s;
# Статика и картинки: одна страница — ~110 запросов разом, отдаются из кэша
limit_req_zone  $limit_key zone=req_assets:10m rate=50r/s;
# Одновременные скачивания оригиналов из /uploads (до 11 МБ): режут канал быстрее всего
limit_conn_zone $limit_key zone=conn_uploads:10m;

# Скорость отдачи оригиналов — тоже только для внешних адресов. Next забирает оригинал
# для /_next/image и ждёт не больше 7 с: на 1 МБ/с файл в 11 МБ не успел бы, и картинка
# отвечала бы 504
map $limit_exempt $uploads_rate {
    0 1m;
    1 0;
}

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# --- Кэш -------------------------------------------------------------------------
# Каталог — том nginx-cache (см. docker-compose.yml), переживает пересборку контейнера
proxy_cache_path /var/cache/nginx/pages  levels=1:2 keys_zone=cache_pages:10m
                 max_size=200m inactive=24h use_temp_path=off;
proxy_cache_path /var/cache/nginx/assets levels=1:2 keys_zone=cache_assets:20m
                 max_size=2g inactive=30d use_temp_path=off;

# /_next/image выбирает формат по Accept. Сводим Accept к двум значениям, чтобы нельзя
# было размножить копии в кэше разными заголовками. Форматы — images.formats в
# frontend/next.config.ts (по умолчанию только webp; если включите avif — добавьте сюда)
map $http_accept $img_accept {
    default         "*/*";
    "~image/webp"   "image/webp";
}

# --- Ключ микрокэша страниц ---------------------------------------------------------
# Next не читает параметры запроса (searchParams во frontend/src нигде нет), кроме
# служебного _rsc навигации. Остальные параметры отбрасываются и в ключе, и в запросе к
# Next: иначе /?x=1, /?x=2… или метки ссылок (utm_*, yclid, fbclid) рендерились бы
# каждый раз заново, а случайным параметром можно обойти кэш.
# ВНИМАНИЕ: если страница начнёт читать параметр (поиск, фильтры, ?page=), добавьте его
# сюда и в rewrite в location / — иначе всем придёт одна и та же страница
map $arg__rsc $front_args {
    ""      "";
    default "_rsc=$arg__rsc";
}
# Заголовки навигации Next имеют смысл только в RSC-запросе (заголовок RSC: 1). В обычном
# запросе HTML их не передаём и в ключ не берём — иначе ими тоже обходится кэш
map $http_rsc $front_rsc_state_tree {
    ""      "";
    default $http_next_router_state_tree;
}
map $http_rsc $front_rsc_next_url {
    ""      "";
    default $http_next_url;
}
map $http_rsc $front_rsc_prefetch {
    ""      "";
    default $http_next_router_prefetch;
}
map $http_rsc $front_rsc_segment_prefetch {
    ""      "";
    default $http_next_router_segment_prefetch;
}
# Нагрузочный тест мимо кэша (loadtest/pages.js, BUST=1): заголовок X-Loadtest-Bust: 1
# с адресов без лимитов (limit-exempt.conf, LAN) — рендер в обход кэша. Для остальных
# заголовок ничего не делает
map "$limit_exempt:$http_x_loadtest_bust" $loadtest_bust {
    default "";
    "1:1"   1;
}

# --- Next ------------------------------------------------------------------------
upstream front {
    # zone — чтобы max_conns считался общим на все воркеры, а не на каждый
    zone front 64k;
    # Больше одновременных запросов Next не получит. Остальным — 503 или копия из кэша.
    # Подбирается нагрузочным тестом (loadtest/README.md): Node рендерит в одном потоке,
    # и при 32 на перегрузке лишние ждали в его очереди по 2 с вместо быстрого 503
    server front:3000 max_conns=16;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name ${NGINX_SERVER_NAME};

    if ($not_allowed_method) {
        return 405;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Счётчики соединений nginx для Netdata (docker-compose-monitoring.yml). С хоста
    # запрос приходит через docker-proxy с адреса шлюза docker-сети
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${NGINX_SERVER_NAME};

    ssl_certificate /etc/letsencrypt/live/${NGINX_SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NGINX_SERVER_NAME}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($not_allowed_method) {
        return 405;
    }
    if ($http_user_agent = "") {
        return 444;
    }
    if ($http_user_agent ~* "(python-requests|curl|wget|Go-http-client|masscan|sqlmap)") {
        return 444;
    }

    # Заголовки для Strapi (для Next — proxy-front.conf: location с собственными
    # proxy_set_header эти не наследует). X-Forwarded-For перезаписываем, а не дописываем:
    # Strapi доверяет прокси (backend/config/server.ts) и берёт первый адрес из списка,
    # так клиент не подсунет чужой IP
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next отвечает 502, когда занят весь max_conns (или лежит). Отдаём понятный 503
    error_page 502 504 = @busy;
    location @busy {
        default_type "text/plain; charset=utf-8";
        add_header Retry-After 10 always;
        return 503 "Сайт перегружен, попробуйте через минуту\n";
    }

    # Strapi REST API. Фронт ходит в него изнутри docker-сети (http://strapi:1337/api),
    # браузеру он не нужен. Снаружи — только админам (тяжёлые populate и bcrypt на /api/auth)
    location /api/ {
        include /etc/nginx/allowed-ips.conf;
        deny all;

        proxy_pass http://strapi:1337;
    }

    # Strapi uploads (оригиналы картинок, PDF). Посетителям картинки отдаются через
    # /_next/image, сюда напрямую попадают картинки и файлы из markdown и админка.
    # Оригиналы: не больше 4 одновременно с IP и не быстрее 1 МБ/с на скачивание
    # (после первого МБ), то есть до ~32 Мбит/с с одного адреса
    location /uploads/ {
        root /var/data/strapi;
        expires 1y;
        add_header Cache-Control "public, immutable";

        limit_req zone=req_assets burst=300 nodelay;
        limit_conn conn_uploads 4;
        limit_rate_after 1m;
        limit_rate $uploads_rate;
    }

    # Превью, которые делает Strapi (их пачками грузит медиатека админки): только частота.
    # Регулярное выражение важнее префикса /uploads/ выше, поэтому превью попадают сюда
    location ~ ^/uploads/(?:thumbnail|small|medium|large)_ {
        root /var/data/strapi;
        expires 1y;
        add_header Cache-Control "public, immutable";

        limit_req zone=req_assets burst=300 nodelay;
    }

    # Strapi Admin Panel
    location ~* ^/(admin|content-type-builder|content-manager|users-permissions|email|i18n|sortable-entries) {
        include /etc/nginx/allowed-ips.conf;
        deny all;

        client_max_body_size 10m;

        proxy_pass http://strapi:1337;
    }

    # Admin endpoint for file uploading
    location = /upload {
        include /etc/nginx/allowed-ips.conf;
        deny all;

        client_max_body_size 100m;
        # Большой файл с медленного канала за 10 с не дойдёт
        client_body_timeout 60s;

        proxy_pass http://strapi:1337;
    }

    # Other admin upload api endpoints
    location /upload/ {
        include /etc/nginx/allowed-ips.conf;
        deny all;

        proxy_pass http://strapi:1337;
    }

    # Сборка Next: имена файлов с хэшем содержимого, поэтому кэш на месяц безопасен.
    # Старые файлы остаются в кэше и после деплоя — у кого открыта старая версия, не сломается
    location ^~ /_next/static/ {
        limit_req zone=req_assets burst=300 nodelay;

        proxy_pass http://front;
        include /etc/nginx/proxy-front.conf;

        proxy_cache cache_assets;
        proxy_cache_key $uri;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status always;
    }

    # Оптимизатор картинок Next (sharp, дорого по CPU). В Next уходят только url, w и q —
    # ровно то, из чего собран ключ кэша. Иначе запрос с лишними или повторяющимися
    # параметрами мог бы положить в кэш ошибку под ключом нормальной картинки
    location = /_next/image {
        limit_req zone=req_assets burst=300 nodelay;

        proxy_pass http://front/_next/image?url=$arg_url&w=$arg_w&q=$arg_q;
        include /etc/nginx/proxy-front.conf;
        proxy_set_header Accept $img_accept;

        proxy_cache cache_assets;
        proxy_cache_key "img|$arg_url|$arg_w|$arg_q|$img_accept";
        # Имена загруженных файлов в Strapi тоже с хэшем, так что картинка по ключу не меняется
        proxy_ignore_headers Cache-Control Expires Vary;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 400 404 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status always;
    }

    # Все остальные запросы — во фронт (страницы и RSC-запросы навигации)
    location / {
        limit_req zone=req_pages burst=40 nodelay;

        # Из параметров запроса в Next уходит только _rsc (см. $front_args выше).
        # $uri уже раскодирован, при передаче nginx кодирует его заново.
        # Последний «?» — не дописывать исходные параметры
        rewrite ^ $uri?$front_args? break;

        proxy_pass http://front;
        include /etc/nginx/proxy-front.conf;
        # Заголовки навигации — только для RSC-запросов (пустой заголовок nginx не передаёт)
        proxy_set_header Next-Router-State-Tree $front_rsc_state_tree;
        proxy_set_header Next-Url $front_rsc_next_url;
        proxy_set_header Next-Router-Prefetch $front_rsc_prefetch;
        proxy_set_header Next-Router-Segment-Prefetch $front_rsc_segment_prefetch;

        # Микрокэш. Next помечает динамические страницы no-store, но страницы у всех
        # одинаковые (тема переключается в браузере), поэтому заголовок игнорируем.
        # Ответы с Set-Cookie nginx по-прежнему не кэширует.
        # RSC-запросы навигации отличаются заголовками — они входят в ключ (Next
        # перечисляет их в Vary). В ключе — ровно то, что уходит в Next
        proxy_cache cache_pages;
        # Host в ключ не входит: сервер один, а иначе кэш обходится подменой Host
        proxy_cache_key "$uri|$front_args|$http_rsc|$front_rsc_prefetch|$front_rsc_segment_prefetch|$front_rsc_state_tree|$front_rsc_next_url";
        proxy_cache_bypass $loadtest_bust;
        proxy_no_cache $loadtest_bust;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 301 302 404 10s;
        # Одновременные запросы одной страницы ждут один рендер, а не делают каждый свой
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        # Пока обновляется — отдаём прошлую копию; если Next или Strapi упали — тоже
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache $upstream_cache_status always;
    }
}
