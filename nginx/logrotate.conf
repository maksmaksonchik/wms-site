# Ротация логов nginx внутри контейнера (запускается из docker-entrypoint.sh раз в час).
# Ротирует раз в сутки или раньше, если файл вырос больше maxsize.
/var/log/nginx/*.log {
    su root root
    daily
    maxsize 100M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    create 0640 nginx adm
    sharedscripts
    postrotate
        # USR1: nginx переоткрывает лог-файлы, fail2ban переключается на новый файл сам
        if [ -f /run/nginx.pid ]; then
            kill -USR1 "$(cat /run/nginx.pid)"
        fi
    endscript
}
