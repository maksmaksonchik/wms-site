# Ротация логов nginx внутри контейнера (запускается из docker-entrypoint.sh раз в час).
# Ротирует раз в сутки или раньше, если файл вырос больше maxsize.
# rotate — число файлов, а не дней: 120 файлов — это ~4 месяца при обычном трафике
# (около 10–30 МБ в день, в .gz ~1–3 МБ), чтобы за сезон декабрь–февраль можно было
# посчитать посетителей (GoAccess). Флуд или нагрузочный тест, раздувший лог больше
# maxsize, дают лишние файлы за день и сокращают срок. На диске — не больше ~1.2 ГБ
# (120 × 100 МБ в .gz)
/var/log/nginx/*.log {
    su root root
    daily
    maxsize 100M
    rotate 120
    missingok
    notifempty
    compress
    delaycompress
    create 0640 nginx adm
    sharedscripts
    postrotate
        # USR1: nginx переоткрывает лог-файлы, fail2ban переключается на новый файл сам
        if [ -f /run/nginx.pid ]; then
            kill -USR1 "$(cat /run/nginx.pid)"
        fi
    endscript
}
