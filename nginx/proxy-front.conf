# Проксирование в Next (upstream front в nginx.conf). Подключается в location целиком:
# location со своими proxy_set_header не наследует заголовки уровня server
proxy_http_version 1.1;
# Пустой Connection — чтобы работал keepalive до upstream
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
