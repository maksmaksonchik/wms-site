# For production use only
# Имя проекта задано явно: от него зависят имена томов (wms-site_strapi-data,
# wms-site_strapi-uploads). Иначе оно берётся из имени каталога, и клон в другой
# каталог молча поднимется с пустыми томами
name: wms-site


# Ограничение логов контейнеров (stdout/stderr). Совпадает с /etc/docker/daemon.json на сервере
# (драйвер local сжимает логи); задано и здесь, чтобы не зависеть от настроек конкретной машины
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

# Лимиты ресурсов (ВМ: 4 vCPU, 4 ГБ + 1 ГБ swap). Смысл не в экономии, а в том, чтобы
# перегруженный сервис (например, Next, пережимающий картинки) не отнял CPU и память
# у остальных, а при нехватке памяти ядро убивало его, а не базу.
# Числа подобраны с запасом; уточняются по Netdata под нагрузкой (loadtest/README.md)

services:
  strapi-db:
    logging: *default-logging
    container_name: wms_strapi_db
    restart: always
    env_file: backend/.env
    image: postgres:17-alpine
    # Без жёсткого лимита, но OOM killer выберет базу последней
    oom_score_adj: -500
    volumes:
      - strapi-data:/var/lib/postgresql/data/

  strapi:
    logging: *default-logging
    container_name: wms_strapi
    build:
      context: backend/
      dockerfile: Dockerfile
    restart: always
    env_file: backend/.env
    depends_on:
      - strapi-db
    cpus: 2
    mem_limit: 1g
    volumes:
      - strapi-uploads:/opt/app/public/uploads/

  front:
    logging: *default-logging
    container_name: wms_front
    build:
      context: frontend/
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - strapi
    # Node однопоточный, но sharp (картинки) использует несколько ядер
    cpus: 2
    mem_limit: 1g

  nginx:
    logging: *default-logging
    container_name: wms_nginx
    build:
      context: nginx/
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    # Сам nginx занимает мало, но в лимит контейнера входят буферы сокетов ядра и page cache
    # файлов кэша. Когда канал забит (~350 Мбит/с, 200 соединений), неотправленные ответы
    # копятся в буферах: на тесте 2026-11-20 это ~150 МБ сокетов + ~110 МБ буферов nginx.
    # При 256m ядро выселяло кэш из памяти, nginx читал его с диска и простаивал (memory
    # pressure ~40%). 512m — с запасом, на ВМ свободно ~2.9 ГБ
    mem_limit: 512m
    # Под worker_rlimit_nofile из nginx/nginx-main.conf
    ulimits:
      nofile: 65536
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template
      - ./nginx/allowed-ips.conf:/etc/nginx/allowed-ips.conf
      - ./nginx/limit-exempt.conf:/etc/nginx/limit-exempt.conf:ro
      # Кэш страниц, статики и картинок (nginx/nginx.conf). Том — чтобы после деплоя
      # не пережимать все картинки заново
      - nginx-cache:/var/cache/nginx
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./nginx/logs:/var/log/nginx
      - strapi-uploads:/var/data/strapi/uploads
    depends_on:
      - front
    ports:
      - "80:80"
      - "443:443"

  certbot:
    logging: *default-logging
    container_name: wms_certbot
    image: certbot/certbot:latest
    restart: always
    mem_limit: 256m
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --max-log-backups 14; sleep 12h & wait $${!}; done;'"

  fail2ban:
    logging: *default-logging
    container_name: wms_fail2ban
    image: crazymax/fail2ban:latest
    restart: always
    mem_limit: 256m
    volumes:
      - ./fail2ban/jail.local:/etc/fail2ban/jail.local:ro
      # Образ подключает фильтры из /data/filter.d поверх стандартных, а базу банов держит в /data/db
      - ./fail2ban/filter.d:/data/filter.d:ro
      - ./fail2ban/db:/data/db
      - ./nginx/logs:/var/log/nginx:ro
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=Asia/Yekaterinburg
    depends_on:
      - nginx

volumes:
  strapi-data:
  strapi-uploads:
  nginx-cache:
