# For production use only
# Имя проекта задано явно: от него зависят имена томов (wms-site_strapi-data,
# wms-site_strapi-uploads). Иначе оно берётся из имени каталога, и клон в другой
# каталог молча поднимется с пустыми томами
name: wms-site


# Ограничение логов контейнеров (stdout/stderr). Совпадает с /etc/docker/daemon.json на сервере
# (драйвер local сжимает логи); задано и здесь, чтобы не зависеть от настроек конкретной машины
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

# Образы strapi, front и nginx собирает GitHub Actions (.github/workflows/images.yml),
# ВМ их только скачивает. Тег — sha-<хэш коммита>: npm run prod (scripts/deploy.sh) берёт
# хэш текущего git HEAD, так что код в образах совпадает с конфигами из этого же коммита,
# и записывает тег в .env (IMAGE_TAG) — его же видят ручные docker compose и restore.sh.
# Откат: IMAGE_TAG=sha-<старый хэш> npm run prod. Без IMAGE_TAG в .env — latest
# (последняя сборка main). Собрать на самой ВМ (если GitHub недоступен; нужно ~3.5 ГБ
# памяти, на ВМ с 2 ГБ — только с остановленным сайтом и swap) — npm run prod:build-local,
# см. docker-compose.build.yml

# Лимиты ресурсов рассчитаны на ВМ 2 vCPU / 2 ГБ + 1 ГБ swap. Смысл не в экономии, а в том,
# чтобы перегруженный сервис (например, Next, пережимающий картинки) не отнял CPU и память
# у остальных, а при нехватке памяти ядро убивало его, а не базу.
# Лимит — потолок, а не резерв: сумма лимитов (~2.4 ГБ) больше памяти ВМ, но все сервисы
# сразу до потолков не доходят. Пики по Netdata (нагрузочные тесты 2026-11-20 и 2026-11-23
# на 4 vCPU / 4 ГБ): front 274 МБ, strapi 246, nginx 325, Netdata 245, база 58,
# fail2ban 33, certbot 60; на всей ВМ занято не больше ~1.5 ГБ (вместе с ядром и Docker).
# Уточняются по Netdata под нагрузкой (loadtest/README.md)

services:
  strapi-db:
    logging: *default-logging
    container_name: wms_strapi_db
    restart: always
    env_file: backend/.env
    image: postgres:17-alpine
    # Без жёсткого лимита, но OOM killer выберет базу последней
    oom_score_adj: -500
    volumes:
      - strapi-data:/var/lib/postgresql/data/

  strapi:
    logging: *default-logging
    container_name: wms_strapi
    image: ${IMAGE_REGISTRY:-ghcr.io/maksmaksonchik}/wms-site-strapi:${IMAGE_TAG:-latest}
    restart: always
    env_file: backend/.env
    depends_on:
      - strapi-db
    # Под нагрузкой Strapi почти не работает (Next кэширует его ответы), пик 246 МБ.
    # Запас — на загрузку картинок в админке: sharp режет оригиналы до 11 МБ на форматы
    cpus: 1.5
    mem_limit: 768m
    volumes:
      - strapi-uploads:/opt/app/public/uploads/

  front:
    logging: *default-logging
    container_name: wms_front
    image: ${IMAGE_REGISTRY:-ghcr.io/maksmaksonchik}/wms-site-front:${IMAGE_TAG:-latest}
    restart: always
    # Образ из CI собран без .env, настройки — отсюда. NEXT_PUBLIC_ASSETS_BASE_URL уже вшит
    # в код для браузера при сборке и должен совпадать со значением в workflow
    env_file: frontend/.env
    depends_on:
      - strapi
    # Node однопоточный, но sharp (картинки) и сборщик мусора используют ещё ядра: на тесте
    # мимо кэша front занимал ~1.5 ядра. 1.5 из 2 — чтобы nginx оставалось ядро на TLS
    # и отдачу кэша, пока Next перегружен. Пик памяти 274 МБ
    cpus: 1.5
    mem_limit: 512m

  nginx:
    logging: *default-logging
    container_name: wms_nginx
    image: ${IMAGE_REGISTRY:-ghcr.io/maksmaksonchik}/wms-site-nginx:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    # Сам nginx занимает мало, но в лимит контейнера входят буферы сокетов ядра и page cache
    # файлов кэша. Когда канал забит (~350 Мбит/с, 200 соединений), неотправленные ответы
    # копятся в буферах: на тесте 2026-11-20 это ~150 МБ сокетов + ~110 МБ буферов nginx.
    # При 256m ядро выселяло кэш из памяти, nginx читал его с диска и простаивал (memory
    # pressure ~40%). С 512m пик 2026-11-23 — 325 МБ, из них ~130 МБ — горячий кэш (ядро
    # освобождает его первым). 384m: буферы помещаются, и для кэша остаётся ~190 МБ.
    # Если на 2 ГБ при забитом канале растёт memory pressure у wms_nginx — поднять
    mem_limit: 384m
    # Под worker_rlimit_nofile из nginx/nginx-main.conf
    ulimits:
      nofile: 65536
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template
      - ./nginx/allowed-ips.conf:/etc/nginx/allowed-ips.conf
      - ./nginx/limit-exempt.conf:/etc/nginx/limit-exempt.conf:ro
      # Кэш страниц, статики и картинок (nginx/nginx.conf). Том — чтобы после деплоя
      # не пережимать все картинки заново
      - nginx-cache:/var/cache/nginx
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./nginx/logs:/var/log/nginx
      - strapi-uploads:/var/data/strapi/uploads
    depends_on:
      - front
    ports:
      - "80:80"
      - "443:443"

  certbot:
    logging: *default-logging
    container_name: wms_certbot
    image: certbot/certbot:latest
    restart: always
    mem_limit: 128m
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --max-log-backups 14; sleep 12h & wait $${!}; done;'"

  fail2ban:
    logging: *default-logging
    container_name: wms_fail2ban
    image: crazymax/fail2ban:latest
    restart: always
    mem_limit: 128m
    volumes:
      - ./fail2ban/jail.local:/etc/fail2ban/jail.local:ro
      # Образ подключает фильтры из /data/filter.d поверх стандартных, а базу банов держит в /data/db
      - ./fail2ban/filter.d:/data/filter.d:ro
      - ./fail2ban/db:/data/db
      - ./nginx/logs:/var/log/nginx:ro
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=Asia/Yekaterinburg
    depends_on:
      - nginx

volumes:
  strapi-data:
  strapi-uploads:
  nginx-cache:
