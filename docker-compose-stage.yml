# For running local stage configuration only
# Имя проекта задано явно: от него зависят имена томов (wms-site_strapi-data,
# wms-site_strapi-uploads). Иначе оно берётся из имени каталога, и клон в другой
# каталог молча поднимется с пустыми томами
name: wms-site

services:
  strapi-db:
    container_name: wms_strapi_db
    restart: always
    env_file: backend/.env
    image: postgres:17-alpine
    volumes:
      - strapi-data:/var/lib/postgresql/data/

  strapi:
    container_name: wms_strapi
    build:
      context: backend/
      dockerfile: Dockerfile
    restart: always
    env_file: backend/.env
    depends_on:
      - strapi-db
    volumes:
      - strapi-uploads:/opt/app/public/uploads/

  front:
    container_name: wms_front
    build:
      context: frontend/
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - strapi

  nginx:
    container_name: wms_nginx
    restart: always
    # Тот же образ, что в проде: в нём основной конфиг и include-файлы (nginx/Dockerfile)
    build:
      context: nginx/
      dockerfile: Dockerfile
    env_file: .env
    ulimits:
      nofile: 65536
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template
      - ./nginx/allowed-ips.conf:/etc/nginx/allowed-ips.conf
      - ./nginx/limit-exempt.conf:/etc/nginx/limit-exempt.conf:ro
      - nginx-cache:/var/cache/nginx
      - ./nginx/site.crt:/etc/letsencrypt/live/${NGINX_SERVER_NAME}/fullchain.pem
      - ./nginx/site.key:/etc/letsencrypt/live/${NGINX_SERVER_NAME}/privkey.pem
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - strapi-uploads:/var/data/strapi/uploads
    depends_on:
      - front
    ports:
      - "80:80"
      - "443:443"


volumes:
  strapi-data:
  strapi-uploads:
  nginx-cache:
