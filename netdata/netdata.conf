# Дополнение к настройкам Netdata по умолчанию: здесь только то, что изменено.
# Подключается в docker-compose-monitoring.yml; применяется npm run monitoring:up.
#
# Хранение метрик (dbengine), три яруса. Каждый ярус удаляет старое, когда упирается
# в срок или в размер, смотря что наступит раньше, так что диск больше суммы размеров
# не вырастет. Фактически занято — http://192.168.0.1:19999/api/v2/info, поле db_size.
#   ярус 0 — каждая секунда: 1 ГБ, ~9 дней (по умолчанию) — разбор нагрузочных тестов
#   ярус 1 — каждая минута:  2 ГБ, 4 месяца (по умолчанию 1 ГБ / 3 месяца, но 1 ГБ
#            хватало на ~2.7 месяца — меньше сезона декабрь–февраль)
#   ярус 2 — каждый час:     1 ГБ, 2 года (по умолчанию; за 2 года набирается ~250 МБ)
# Сроки всех ярусов заданы явно: если задать срок только одному, у остальных Netdata
# снимает ограничение по времени (проверено на v2.13), и они хранят до заполнения размера
[db]
    dbengine tier 0 retention size = 1GiB
    dbengine tier 0 retention time = 14d
    dbengine tier 1 retention size = 2GiB
    dbengine tier 1 retention time = 4mo
    dbengine tier 2 retention size = 1GiB
    dbengine tier 2 retention time = 2y
